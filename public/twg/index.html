<body>
<header class="mast">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 30 30" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="15" cy="15" r="13.2"/><circle cx="15" cy="15" r="9" opacity=".56"/><circle cx="15" cy="15" r="3"/><path d="M15 2v6m13 7h-6M15 28v-6M2 15h6"/></svg>
      TWG <span>3D WORKBENCH</span>
    </div>
    <div class="head-actions">
      <label>Generator layout
        <select id="layout" aria-label="Generator layout">
          <option value="D">D · Shared treble branches</option>
          <option value="E">E · Octave-shifted shafts</option>
        </select>
      </label>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="lead">
    <div><h1>Mechanical generator</h1><p id="summary">Full assembly loading…</p></div>
    <div id="lead-spec" class="lead-spec"></div>
  </div>
  <div class="work">
    <section class="stage" aria-label="Interactive 3D generator">
      <div id="viewport" class="viewport">
        <canvas id="render" tabindex="0" aria-label="3D generator view. Drag to orbit. Shift and drag to pan. Scroll to zoom. Press R to reset."></canvas>
        <div class="stage-top">
          <div class="seg dark" aria-label="Assembly presentation">
            <button id="assembled" type="button" aria-pressed="true">Assembly</button>
            <button id="cutaway" type="button" aria-pressed="false">Cutaway</button>
            <button id="exploded" type="button" aria-pressed="false">Exploded</button>
          </div>
          <div class="seg dark" aria-label="Camera orientations" id="camera-views">
            <button type="button" data-view="iso" aria-pressed="true">3/4</button>
            <button type="button" data-view="front" aria-pressed="false">Front</button>
            <button type="button" data-view="top" aria-pressed="false">Top</button>
            <button type="button" data-view="side" aria-pressed="false">Side</button>
          </div>
        </div>
        <div id="stage-mid" class="stage-mid">
          <svg id="overlay" class="overlay" aria-hidden="true"></svg>
          <div id="anchors"></div>
        </div>
        <div class="stage-bottom">
          <div id="stage-help" class="stage-note">Drag to orbit · Scroll to zoom</div>
          <div class="seg dark" aria-label="Inspection tools">
            <button id="dimensions" type="button" aria-pressed="false">Dimensions</button>
            <button id="measure" type="button" aria-pressed="false">Measure</button>
            <button id="reset-view" type="button">Fit</button>
          </div>
        </div>
        <div id="stage-message" class="stage-message" role="status">Building the assembly…</div>
      </div>
      <div class="stage-controls">
        <div class="layers" id="layers" aria-label="Visible component layers">
          <span class="overline">Layers</span>
          <button data-layer="frame" aria-pressed="true" type="button" style="--dot:#a7b6be">Stand</button>
          <button data-layer="drive" aria-pressed="true" type="button" style="--dot:#eac289">Drive</button>
          <button data-layer="wheels" aria-pressed="true" type="button" style="--dot:#70c9b0">Wheels</button>
          <button data-layer="pickups" aria-pressed="true" type="button" style="--dot:#b4b8a1">Pickups</button>
          <button data-layer="guard" aria-pressed="false" type="button" style="--dot:#77abc3">Guard</button>
          <button id="labels" aria-pressed="true" type="button" style="--dot:#e9edee">Labels</button>
        </div>
        <label class="explode-control">Explode <input id="explode-amount" type="range" min="0" max="100" value="0" step="1" aria-label="Explosion distance"><output id="explode-label" class="mono">0%</output></label>
      </div>
    </section>
    <aside class="inspector" aria-label="Assembly inspector">
      <div class="inspect-head"><h2>Assembly inspector</h2><span id="power-state" class="state-chip off">LOADING</span></div>
      <div id="inspector-tabs" class="seg inspector-tabs" role="tablist" aria-label="Inspection view">
        <button type="button" role="tab" data-inspect="part" aria-selected="true">Component</button>
        <button type="button" role="tab" data-inspect="drive" aria-selected="false">Speeds</button>
        <button type="button" role="tab" data-inspect="parts" aria-selected="false">Inventory</button>
      </div>
      <div class="inspect-body">
        <div id="inspect-part" role="tabpanel">
          <label class="inspect-select">Select component <select id="component" aria-label="Select component"></select></label>
          <div id="part-content"></div>
        </div>
        <div id="inspect-drive" role="tabpanel" hidden></div>
        <div id="inspect-parts" role="tabpanel" hidden></div>
      </div>
    </aside>
  </div>
  <section class="transport" aria-label="Motor controls">
    <button id="power" type="button" class="button primary power">Start motor</button>
    <label class="rpm-control">Target motor <output id="motor-target" for="motor-rpm">– rpm</output><input id="motor-rpm" type="range" min="800" max="1500" step="0.1" value="1141.1" aria-label="Target motor RPM"></label>
    <button id="tune" type="button" class="button" title="Restore the optimized motor setpoint">Tune to A440</button>
    <label class="rate">View speed <select id="time-scale" aria-label="Animation speed"><option value="0.0166666667">1/60×</option><option value=".05" selected>1/20×</option><option value=".25">1/4×</option><option value="1">1×</option></select></label>
  </section>
  <section class="data-panel" aria-label="Drivetrain model and checks">
    <div class="data-top">
      <div class="seg" id="data-tabs" role="tablist" aria-label="Technical views">
        <button type="button" role="tab" data-data="checks" aria-selected="true">Fit checks</button>
        <button type="button" role="tab" data-data="belt" aria-selected="false">Belt geometry</button>
        <button type="button" role="tab" data-data="tone" aria-selected="false">Note map</button>
      </div>
      <small id="data-status"></small>
    </div>
    <div id="data-area" class="tab-content"></div>
  </section>
  <footer class="foot"><span>TWG · 3D assembly study</span><span>Dimensions in mm · A4 = 440 Hz · Geometry and kinematics</span></footer>
</main>
<script>const TWG = (() => {
  const names = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
  const tones = Array.from({length: 91}, (_, i) => ({
    index: i, note: names[i % 12] + (1 + Math.floor(i / 12)),
    target: 440 * 2 ** ((i - 45) / 12)
  }));
  const toCents = (ratio) => 1200 * Math.log2(ratio);
  const ET = toCents(1.5) - 700;
  const historical = [[85,104],[71,82],[67,73],[35,36],[103,100],[24,22],[37,32],[49,40],[48,37],[22,16],[67,46],[54,35]];
  const groupSpec = [
    [67,55,'3:2 10:3 15:4 22:6 27:8 34:12 39:16 46:24 51:32 58:48 63:64 70:96 75:128'],
    [87,101,'4:3 9:4 16:6 21:8 28:12 33:16 40:24 45:32 52:48 57:64 64:96 69:128'],
    [58,20,'6:1 18:2 30:4 42:8 54:16 66:32 76:57 78:64 88:114 90:128'],
    [63,29,'1:1 13:2 25:4 37:8 49:16 61:32 71:57 73:64 83:114 85:128'],
    [41,20,'0:1 12:2 24:4 36:8 48:16 60:32 72:64 82:114 84:128'],
    [43,28,'7:2 19:4 31:8 43:16 55:32 65:57 67:64 77:114 79:128'],
    [46,20,'2:1 14:2 26:4 38:8 50:16 62:32 74:64 86:128'],
    [52,19,'5:1 17:2 29:4 41:8 53:16 87:114 89:128'],
    [70,43,'8:2 20:4 32:8 44:16 56:32 68:64 80:128'],
    [60,31,'11:2 23:4 35:8 47:16 59:32 81:114']
  ];
  const market = new Set([16,18,20,24,30,32,36,40,48,60,64,72,80,96,100]);
  const gcd = (a, b) => b ? gcd(b, a % b) : a;
  function pairs(max) {
    const candidates = new Map();
    for (let a = 16; a <= max; a++) for (let b = 16; b <= max; b++) {
      const d = gcd(a, b), key = a / d + '/' + b / d;
      const cost = a + b + (market.has(a) ? 0 : 12) + (market.has(b) ? 0 : 12);
      if (!candidates.has(key) || cost < candidates.get(key).cost) candidates.set(key, {a,b,cost,ratio:a/b});
    }
    return [...candidates.values()];
  }
  function fitChromatic(shifts, limit) {
    const p = pairs(limit);
    const motorL = toCents(800), motorH = toCents(1500);
    const centers = shifts.map((shift, i) => p.map(pair => ({
      pair, center: toCents(tones[i].target * 30 * 2 ** shift / pair.ratio)
    })).filter(({center}) => center > motorL - 3 && center < motorH + 3));
    function feasible(tolerance) {
      const events = [];
      centers.forEach((list, i) => list.forEach(({center}) => {
        const start = Math.max(motorL, center - tolerance);
        const end = Math.min(motorH, center + tolerance);
        if (end >= start) events.push([start,i,1],[end,i,-1]);
      }));
      events.sort((a,b) => a[0]-b[0] || b[2]-a[2]);
      const counts = new Int32Array(12);

    let right = unit(cross(camera.up || [0, 1, 0], back));
    if (Math.hypot(...right) < 0.01) right = unit(cross([0, 0, 1], back));
    const up = cross(back, right);
    const f = 1 / Math.tan((camera.fov || 38) * Math.PI / 360);
    const near = Math.max(0.1, distance / 1000);
    const far = Math.max(4000, distance * 15);
    const depth = (far + near) / (near - far);
    for (let i = 0; i < 3; i++) {
      out[i * 4] = right[i] * f / ratio;
      out[i * 4 + 1] = up[i] * f;
      out[i * 4 + 2] = depth * back[i];
      out[i * 4 + 3] = -back[i];
    }
    out[12] = -dot(right, eye) * f / ratio;
    out[13] = -dot(up, eye) * f;
    out[14] = -dot(back, eye) * depth + 2 * far * near / (near - far);
    out[15] = dot(back, eye);
  }

  function transform(out, part) {
    const a = Math.cos(part.rx || 0), b = Math.sin(part.rx || 0);
    const c = Math.cos(part.ry || 0), d = Math.sin(part.ry || 0);
    const e = Math.cos(part.rz || 0), f = Math.sin(part.rz || 0);
    const {sx, sy, sz} = part;
    out[0] = c * e * sx;
    out[1] = (a * f + b * d * e) * sx;
    out[2] = (b * f - a * d * e) * sx;
    out[4] = -c * f * sy;
    out[5] = (a * e - b * d * f) * sy;
    out[6] = (b * e + a * d * f) * sy;
    out[8] = d * sz;
    out[9] = -b * c * sz;
    out[10] = a * c * sz;
    out[12] = part.x;
    out[13] = part.y;
    out[14] = part.z;
  }

  function hexColor(value) {
    let hex = (value || '#a2aaab').replace('#', '');
    if (hex.length === 3) hex = [...hex].map(char => char + char).join('');
    const rgb = parseInt(hex, 16);
    return [(rgb >> 16 & 255) / 255, (rgb >> 8 & 255) / 255, (rgb & 255) / 255];
  }

  class TWGRenderer {
    constructor(canvas) {
      const gl = canvas.getContext('webgl', {
        alpha: false, antialias: true, depth: true, powerPreference: 'high-performance'
      }) || canvas.getContext('experimental-webgl');
      if (!gl) throw new Error('WebGL is unavailable');
      this.canvas = canvas;
      this.gl = gl;
      this.program = program(gl);
      this.attributes = Object.fromEntries(['position', 'normal'].map(name =>
        [name, gl.getAttribLocation(this.program, name)]));
      this.uniforms = Object.fromEntries(['vp', 'model', 'inverseScaleSquared', 'pigment', 'eye',
        'metal', 'mode', 'selected'].map(name => [name, gl.getUniformLocation(this.program, name)]));
      this.vp = new Float32Array(16);
      this.model = new Float32Array(16);
      this.model[15] = 1;
      this.meshes = new Map();
      this.colors = new Map();
      this.geometry = new Map([['box', box()], ['cylinder', tube(0, 48)], ['grid', grid()]]);
      this.parts = [];
      this.pickBuffer = null;
      this.resize();
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
    }

    resize() {
      const width = this.canvas.clientWidth || 1;
      const height = this.canvas.clientHeight || 1;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5, 2200 / Math.max(width, height));
      const w = Math.max(1, Math.round(width * dpr));
      const h = Math.max(1, Math.round(height * dpr));
      if (this.canvas.width !== w || this.canvas.height !== h) {
        this.canvas.width = w;
        this.canvas.height = h;
        if (this.pickBuffer) this.clearPickBuffer();
      }
      this.width = width;
      this.height = height;
    }

    mesh(part) {
      const ratio = Math.round(Math.min(0.98, Math.max(0.04, part.innerRatio ??
        (part.kind === 'torus' ? 0.72 : 0.68))) * 100) / 100;
      let shape = part.kind === 'ring' || part.kind === 'torus' ? part.kind + ratio : part.kind;
      if(part.kind==='track') shape += [part.periods,part.sx,part.radialWidth,part.amplitude].map(v=>v.toFixed(5)).join('/');
      if(part.kind==='sprocket') shape += part.teeth;
      if (this.meshes.has(shape)) return this.meshes.get(shape);
      const gl = this.gl;
      let source = this.geometry.get(shape);
      if(part.kind==='track'){
        const h = t => (part.radialWidth/2 + part.amplitude * Math.cos(part.periods*t))/part.sx;
        source = profileTube(Math.max(96,part.periods*8),t=>.5-h(t),t=>.5+h(t));
      }
      if(part.kind==='sprocket'){
        const depth = t => [1.05,.31,.31,1.05][Math.round(t/TAU*part.teeth*4)%4];
        source = profileTube(part.teeth*4,null,t=>.5-depth(t)/part.sx);
      }
      if (!source) source = part.kind === 'torus' ? torus(ratio / 2, 48, 12) : tube(ratio / 2, 64);
      const vertices = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vertices);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(source.coordinates), gl.STATIC_DRAW);
      const elements = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, elements);
      gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(source.indices), gl.STATIC_DRAW);
      const mesh = {vertices, elements, count: source.indices.length};
      this.meshes.set(shape, mesh);
      return mesh;
    }

    bind(mesh) {
      if (mesh === this.bound) return;
      const gl = this.gl;
      this.bound = mesh;
      gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vertices);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.elements);
      gl.enableVertexAttribArray(this.attributes.position);
      gl.enableVertexAttribArray(this.attributes.normal);
      gl.vertexAttribPointer(this.attributes.position, 3, gl.FLOAT, false, 24, 0);
      gl.vertexAttribPointer(this.attributes.normal, 3, gl.FLOAT, false, 24, 12);
    }

    draw(part, rgba, mode, selected = 0) {
      const gl = this.gl, u = this.uniforms;
      const mesh = this.mesh(part);
      this.bind(mesh);
      transform(this.model, part);
      gl.uniformMatrix4fv(u.model, false, this.model);
      gl.uniform3f(u.inverseScaleSquared, 1 / part.sx ** 2, 1 / part.sy ** 2, 1 / part.sz ** 2);
      gl.uniform4f(u.pigment, ...rgba);
      gl.uniform1f(u.mode, mode);
      gl.uniform1f(u.metal, part.metal || 0);
      gl.uniform1f(u.selected, selected);
      gl.drawElements(part.kind === 'grid' ? gl.LINES : gl.TRIANGLES, mesh.count, gl.UNSIGNED_SHORT, 0);
    }

    begin(camera) {
      const gl = this.gl;
      gl.viewport(0, 0, this.canvas.width, this.canvas.height);
      gl.useProgram(this.program);
      gl.uniformMatrix4fv(this.uniforms.vp, false, this.vp);
      gl.uniform3fv(this.uniforms.eye, camera.eye);
      this.bound = null;
    }

    render(parts, camera, opts = {}) {
      const gl = this.gl;
      if (gl.isContextLost()) return;
      this.resize();
      this.camera = camera;
      this.parts = parts.filter(part => part.visible !== false && (part.alpha ?? 1) > 0 &&
        part.sx > 0 && part.sy > 0 && part.sz > 0);
      viewProjection(this.vp, camera, this.width / this.height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      this.begin(camera);
      gl.disable(gl.BLEND);
      gl.depthMask(true);
      gl.clearColor(0.067, 0.106, 0.125, 1);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      if (opts.grid !== false && this.parts.length) {
        const floor = opts.groundY ?? Math.min(...this.parts.map(part => part.y - part.sy / 2)) - 7;
        this.draw({kind: 'grid', x: opts.groundX ?? camera.target[0], y: floor,
          z: opts.groundZ ?? 0, sx: 1, sy: 1, sz: 1}, [0.117, 0.164, 0.184, 1], 0);
      }
      const translucent = [];
      for (const part of this.parts) {
        if ((part.alpha ?? 1) < 0.999) translucent.push(part);
        else this.drawPart(part, opts.selectedId);
      }
      if (translucent.length) {
        const depth = p => this.vp[3] * p.x + this.vp[7] * p.y + this.vp[11] * p.z;
        translucent.sort((a, b) => depth(b) - depth(a));
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
        gl.depthMask(false);
        gl.enable(gl.CULL_FACE);
        gl.cullFace(gl.BACK);
        for (const part of translucent) this.drawPart(part, opts.selectedId);
        gl.disable(gl.CULL_FACE);
        gl.depthMask(true);
        gl.disable(gl.BLEND);
      }
    }

    drawPart(part, selectedId) {
      if (!this.colors.has(part.color)) this.colors.set(part.color, hexColor(part.color));
      const rgb = this.colors.get(part.color);
      this.draw(part, [...rgb, part.alpha ?? 1], 1, selectedId != null && part.id === selectedId ? 1 : 0);
    }

    clearPickBuffer() {
      const gl = this.gl;
      gl.deleteFramebuffer(this.pickBuffer.framebuffer);
      gl.deleteRenderbuffer(this.pickBuffer.depth);
      gl.deleteTexture(this.pickBuffer.color);
      this.pickBuffer = null;
    }

    preparePickBuffer() {
      if (this.pickBuffer) return;
      const gl = this.gl;
      const {width, height} = this.canvas;
      const framebuffer = gl.createFramebuffer();
      const color = gl.createTexture();
      const depth = gl.createRenderbuffer();
      gl.bindTexture(gl.TEXTURE_2D, color);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
      gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, width, height);
      gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, color, 0);
      gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
      this.pickBuffer = {framebuffer, depth, color};
    }

    pick(x, y) {
      const gl = this.gl;
      if (!this.camera || gl.isContextLost() || x < 0 || y < 0 || x >= this.width || y >= this.height) return null;
      this.preparePickBuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.pickBuffer.framebuffer);
      this.begin(this.camera);
      const px = Math.floor(x * this.canvas.width / this.width);
      const py = this.canvas.height - 1 - Math.floor(y * this.canvas.height / this.height);
      gl.enable(gl.SCISSOR_TEST);
      gl.disable(gl.DITHER);
      gl.scissor(px, py, 1, 1);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      for (let i = 0; i < this.parts.length; i++) {
        const part = this.parts[i];
        if (part.pickable === false || part.id == null) continue;
        const key = i + 1;
        this.draw(part, [(key & 255) / 255, (key >> 8 & 255) / 255, (key >> 16 & 255) / 255, 1], 0);
      }
      const pixel = new Uint8Array(4);
      gl.readPixels(px, py, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      gl.disable(gl.SCISSOR_TEST);
      gl.enable(gl.DITHER);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      const index = (pixel[0] | pixel[1] << 8 | pixel[2] << 16) - 1;
      return this.parts[index]?.id ?? null;
    }

    project(x, y, z) {
      const m = this.vp;
      const w = m[3] * x + m[7] * y + m[11] * z + m[15];
      if (w <= 0) return {x: 0, y: 0, visible: false};
      const nx = (m[0] * x + m[4] * y + m[8] * z + m[12]) / w;
      const ny = (m[1] * x + m[5] * y + m[9] * z + m[13]) / w;
      const nz = (m[2] * x + m[6] * y + m[10] * z + m[14]) / w;
      return {x: (0.5 + nx / 2) * this.width, y: (0.5 - ny / 2) * this.height,
        visible: Math.abs(nx) <= 1 && Math.abs(ny) <= 1 && Math.abs(nz) <= 1};
    }
  }

  window.TWGRenderer = TWGRenderer;
})();

              i === 0 ? 4.8 : 3.3, 1.5, i === 0 ? '#d3af80' : colors.steel, 'wheels',
              {spin: id, spinCenter: [x, y], explode: wheelExplode, metal: 0.6});
          }
        }
        for (const face of ['Front', 'Rear']) {
          const tracks = layout.tracks.filter(t => t.face === face);
          if (!tracks.length) continue;
          const side = face === 'Front' ? -1 : 1;
          const faceZ = z + side * 7;
          const boardZ = z + side * 25;
          const boardX = x + outward * 81;
          const boardId = id + '-pickup-board-' + face.toLowerCase();
          const pickupExplode = [outward * 76, 8, side * 34];
          component(boardId, id + ' ' + face.toLowerCase() + ' pickup mount', 'pickup mount', 'pickups',
            boardX, y + 9, boardZ, 'Outboard rail and pickup carrier for ' + tracks.length + ' sensor heads.',
            {shaft: id});
          box(boardId, boardX, y + 8, boardZ, 14, 105, 6, colors.pcb, 'pickups', {explode: pickupExplode});
          box(boardId, boardX + outward * 9, y + 8, boardZ, 5, 111, 12, colors.frame, 'pickups', {explode: pickupExplode});
          const postX = boardX + outward * 12;
          const floorY = treble ? 188 : 16;
          const postHeight = y - 38 - floorY;
          box(boardId, postX, floorY + postHeight / 2, boardZ, 9, postHeight, 12, colors.frame, 'pickups',
            {explode: pickupExplode});
          if (treble) {
            box(boardId, postX, 186, z, 13, 8, 142, colors.frame, 'pickups', {explode: pickupExplode});
          }
          for (const offset of [-39, 51]) {
            cylinder(boardId, boardX, y + offset, boardZ, 6, 8, colors.steel, 'pickups', {explode: pickupExplode});
          }
          tracks.forEach((track, i) => {
            const angle = (i - (tracks.length - 1) / 2) * 0.37;
            const headX = x + outward * Math.cos(angle) * track.radius;
            const headY = y + Math.sin(angle) * track.radius;
            const pickupId = 'pickup-' + track.index;
            const trackId = 'track-' + track.index;
            component(trackId, track.note + ' magnetic track', 'track', 'wheels', headX, headY, faceZ,
              face + ' face · ' + track.periods + ' periods · ' + track.radius.toFixed(1) + ' mm radius.',
              {shaft: id, data: track});
            add(trackId, 'track', x, y, faceZ, track.radius * 2, track.radius * 2, 2.4, colors.track[i % 4],
              'wheels', {spin: id, explode: wheelExplode, periods: track.periods, radialWidth: settings.width, amplitude: track.amplitude});
            component(pickupId, track.note + ' pickup', 'pickup', 'pickups', headX, headY, z + side * 13,
              face + ' face · ' + track.periods + ' periods · ' + track.frequency.toFixed(3) + ' Hz.',
              {shaft: id, data: track});
            box(pickupId, headX, headY, z + side * 14, 7, 9, 7, colors.pickup[i % 4], 'pickups', {explode: pickupExplode, gapDirection: side});
            cylinder(pickupId, headX, headY, z + side * 10, 3, 3, '#e9cc96', 'pickups', {explode: pickupExplode, gapDirection: side});
            box(pickupId, headX, headY, z + side * 20, 5, 6, 10, colors.steelDark, 'pickups', {explode: pickupExplode, gapDirection: side});
            bar(pickupId, headX, headY, boardX, headY, boardZ, 4, 4, colors.steel, 'pickups', {explode: pickupExplode});
          });
        }
      }
    }

    component('guard', 'Drive guard', 'guard', 'guard', 0, 186, 0,
      'Translucent central guard covers the master pulleys and transmission belts.');
    box('guard', 0, 190, 0, 116, 4, 835, '#a8c5cb', 'guard', {alpha: 0.17, explode: [0, 115, 0]});
    for (const side of [-1, 1]) {
      box('guard', side * 58, 184, 0, 3.5, 13, 835, '#a8c5cb', 'guard', {alpha: 0.22, explode: [0, 115, 0]});
    }

    const bounds = {min: [-244, -36, -550], max: [244, plan.id === 'D' ? 385 : 211, 494]};
    bounds.center = bounds.min.map((min, i) => (min + bounds.max[i]) / 2);
    bounds.size = bounds.min.map((min, i) => bounds.max[i] - min);
    return {parts, components, shafts: [...shaftById.values()], master, motor, belts, bounds,
      config: {...plan, settings}};
  };
})();


(() => {
  const TAU = 2 * Math.PI;
  const normalize = (distance, length) => ((distance % length) + length) % length;

  function makeBeltPath({ x1, y1, x2, y2, a, b, pitch }) {
    const radiusA = a * pitch / TAU;
    const radiusB = b * pitch / TAU;
    const centerDistance = Math.hypot(x2 - x1, y2 - y1);
    const delta = radiusA - radiusB;
    if (!(centerDistance > Math.abs(delta))) {
      throw new RangeError('Open belt requires two external tangents');
    }
    const axis = Math.atan2(y2 - y1, x2 - x1);
    const halfAngle = Math.acos(delta / centerDistance);
    const lower = axis - halfAngle;
    const upper = axis + halfAngle;
    const wrapB = 2 * halfAngle;
    const wrapA = TAU - wrapB;
    const straight = Math.sqrt(centerDistance * centerDistance - delta * delta);
    const lowerA = [x1 + radiusA * Math.cos(lower), y1 + radiusA * Math.sin(lower)];
    const upperB = [x2 + radiusB * Math.cos(upper), y2 + radiusB * Math.sin(upper)];
    const sections = [
      { length: straight, point: (s) => [lowerA[0] - s * Math.sin(lower), lowerA[1] + s * Math.cos(lower)] },
      { length: radiusB * wrapB, point: (s) => [
        x2 + radiusB * Math.cos(lower + s / radiusB),
        y2 + radiusB * Math.sin(lower + s / radiusB),
      ] },
      { length: straight, point: (s) => [upperB[0] - s * Math.sin(upper), upperB[1] + s * Math.cos(upper)] },
      { length: radiusA * wrapA, point: (s) => [
        x1 + radiusA * Math.cos(upper + s / radiusA),
        y1 + radiusA * Math.sin(upper + s / radiusA),
      ] },
    ];
    const length = sections.reduce((total, section) => total + section.length, 0);

    function point(distance) {
      let remaining = normalize(distance, length);
      for (const section of sections) {
        if (remaining < section.length) return section.point(remaining);
        remaining -= section.length;
      }
      return lowerA;
    }

    return { length, sections, point, centerDistance, radiusA, radiusB, wrapA, wrapB };
  }

  window.makeTWGBelts = function makeTWGBelts(specs) {
    const parts = [];
    const runs = [];
    const markers = [];

    for (const spec of specs) {
      const { id, parent, shaft, a, b, pitch, width, z, explode } = spec;
      const { length, sections, point, centerDistance, radiusA, radiusB, wrapA, wrapB } = makeBeltPath(spec);
      const wrapDegrees = [wrapA * 360 / TAU, wrapB * 360 / TAU];
      const teethInMesh = [a * wrapA / TAU, b * wrapB / TAU];
      const nearestTeeth = Math.round(length / pitch);
      const nearestPitchLength = nearestTeeth * pitch;
      const run = {
        id, parent, shaft, length, a, b, pitch, width, centerDistance, wrapDegrees, teethInMesh,
        driverWrapDegrees: wrapDegrees[0], drivenWrapDegrees: wrapDegrees[1],
        driverTeethInMesh: teethInMesh[0], drivenTeethInMesh: teethInMesh[1],
        driverPitchRadius: radiusA, drivenPitchRadius: radiusB,
        nearestTeeth, nearestPitchLength, pitchLengthError: length - nearestPitchLength,
        speedRatio: a / b, travelPerDriverRev: a * pitch,
      };
      runs.push(run);

      const thickness = 0.52 * pitch;
      const shared = { id, layer: 'drive', ...(explode ? { explode } : {}) };
      const loopSegments = [1, Math.max(4, Math.ceil(wrapB * 4.5)), 1, Math.max(4, Math.ceil(wrapA * 4.5))];
      for (let sectionIndex = 0; sectionIndex < sections.length; sectionIndex += 1) {
        const section = sections[sectionIndex];
        const segmentCount = loopSegments[sectionIndex];
        for (let i = 0; i < segmentCount; i += 1) {
          const [ax, ay] = section.point(section.length * i / segmentCount);
          const [bx, by] = section.point(section.length * (i + 1) / segmentCount);
          parts.push({
            ...shared, kind: 'box', x: (ax + bx) / 2, y: (ay + by) / 2, z,
            sx: Math.hypot(bx - ax, by - ay) + thickness * 0.38, sy: thickness, sz: width,
            rz: Math.atan2(by - ay, bx - ax), color: '#37313e', metal: 0,
          });
        }
      }

      const markerCount = Math.min(8, nearestTeeth);
      for (let index = 0; index < markerCount; index += 1) {
        const offset = Math.round(index * nearestTeeth / markerCount) * length / nearestTeeth;
        const [x, y] = point(offset);
        const size = pitch * 0.24;
        const part = {
          ...shared, kind: 'box', x, y, z: z + width / 2 + 0.035 * pitch,
          sx: size, sy: size, sz: 0.11 * pitch, rz: 0, color: '#807489', metal: 0,
        };
        parts.push(part);
        markers.push({ part, point, parent, radiusA, offset });
      }
    }

    function update(shaftPhases, explode = 0) {
      for (const { part, point, parent, radiusA, offset } of markers) {
        const phase = shaftPhases[parent] ?? 0;
        const [x, y] = point(offset + phase * radiusA);
        part.x = x;
        part.y = y;
      }
    }

    return { parts, runs, update };
  };
})();


(() => {

  function auditFit(model, runs) {
    const wheelParts=model.parts.filter(p=>p.kind==='cylinder' && p.layer==='wheels' && p.sx===150);
    let wheelGap=Infinity;
    for(let i=0;i<wheelParts.length;i++)for(let j=i+1;j<wheelParts.length;j++){
      const a=wheelParts[i], b=wheelParts[j];
      const axial=Math.abs(a.z-b.z)-(a.sz+b.sz)/2;
      const radial=Math.hypot(a.x-b.x,a.y-b.y)-(a.sx+b.sx)/2;
      wheelGap=Math.min(wheelGap,Math.hypot(Math.max(0,axial),Math.max(0,radial)) || Math.max(axial,radial));
    }
    // Bearing envelope uses the maximum axial protrusion of the block and collars.
    const bearingMeta=model.components.filter(c=>c.type==='bearing');
    const pulleyMeta=model.components.filter(c=>c.type==='pulley');
    let bearingGap=Infinity;
    let nearestPair=[];
    for(const pulley of pulleyMeta){
      for(const bearing of bearingMeta.filter(c=>c.shaft===pulley.shaft)){

    const [w,h,l]=assembly.bounds.size;

    renderPicker();

    renderData();

  function renderPicker() {
    const order = [
      ['Motor and stand',c=>c.id==='motor'||c.id==='master'||c.id==='stand'||c.id==='guard'],

       .map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</optgroup>`).join('');

        const length=norm(delta(assembledPoint(a),assembledPoint(b)));
        markup+=labelLine(pointA,renderer.project(...partPoint(b)),mm(length),'measure');
      }else if(pointA.visible)markup+=`<circle cx="${pointA.x}" cy="${pointA.y}" r="7" class="measure"/>`;

  }

  const meta = items => `<dl class="meta-grid">${items.map(([k,v])=>`<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  const currentRpm = id => speed*((shaftMap.get(id)?.rpm || assembly.config.motor)/assembly.config.motor);
  const activeTone = () => noteTableData.find(n=>n.index===cfg.note) ?? noteTableData[0];
  const liveRpm = id => `<span data-live-rpm="${id}">${rpm(currentRpm(id),1)}</span> rpm`;
  const noteLive = n => `<span data-live-note="${n.index}">${fixed(n.frequency*speed/assembly.config.motor,3)}</span> Hz`;
  const liveBelt = run => `<span data-live-belt="${run.id}">${fixed(run.a*run.pitch*currentRpm(run.parent)/60000,2)}</span> m/s`;
  const runFor = id => belts.runs.find(r=>r.id===id);
  function beltCenterAdjustment(run) {
    const difference = run.driverPitchRadius - run.drivenPitchRadius;
    const term = Math.PI * (run.driverPitchRadius + run.drivenPitchRadius);
    const length = c => 2*Math.sqrt(c*c-difference*difference) + term + 2*difference*Math.asin(difference/c);
    let lo = run.centerDistance-2, hi = run.centerDistance+2;
    for(let i=0;i<24;i++){
      const c=(lo+hi)/2;
      if(length(c)<run.nearestPitchLength)lo=c;else hi=c;
    }
    return (lo+hi)/2-run.centerDistance;
  }
  function signedMm(value){return (value>=0?'+':'−')+mm(Math.abs(value),2);}

        <select id="audition-note" aria-label="Choose pickup note">${noteTableData.map(n=>`<option value="${n.index}" ${n.index===tone.index?'selected':''}>${n.note} · ${n.shaft}</option>`).join('')}</select>

  }

  function select(id) {

        <td><button type="button" data-entity="${r.id}">${r.parent} → ${r.shaft}</button></td><td>${r.a} : ${r.b}</td><td>${mm(r.centerDistance)}</td><td>${mm(r.length,2)}</td>
        <td>${r.nearestTeeth}</td><td>${signedMm(r.pitchLengthError)}</td><td>${signedMm(beltCenterAdjustment(r))}</td>
        <td>${fixed(Math.min(...r.wrapDegrees),1)}°</td><td>${fixed(Math.min(...r.teethInMesh),1)}</td><td>${liveBelt(r)}</td></tr>`).join('')}</tbody></table></div>
        <p class="diagnostic">The pitch length is the calculated tangent-and-arc path. Center correction shows how far the axes would move to fit the nearest whole-tooth loop at its nominal pitch length. Supplier stock and load ratings depend on the selected belt. <a href="https://www.gates.com/content/dam/gates/home/knowledge-center/mectrol/design-manuals/BeltSizingGuide.pdf" target="_blank" rel="noopener">Belt sizing reference</a></p>`;

        <tbody>${noteTableData.map(t=>`<tr><td>${t.index+1}</td><td><button type="button" data-entity="pickup-${t.index}">${t.note}</button></td><td>${t.shaft}</td><td>${t.face}</td><td>${t.periods}</td>
        <td>${mm(t.radius)}</td><td>${fixed(t.target,3)} Hz</td><td>${noteLive(t)}</td><td>${cents(t.cents)}</td></tr>`).join('')}</tbody></table></div>`;

  function setPower() {

  function updateReadouts(force=false) {
    const status=cfg.running?(Math.abs(speed-target)>.2?'RAMPING':'RUNNING'):speed>.25?'COASTING':'STOPPED';
    const chip=$('power-state');
    if(chip.textContent!==status||force){
      chip.textContent=status;
      chip.className='state-chip'+(status==='STOPPED'?' off':status==='COASTING'?' coast':'');
      $('power').classList.toggle('stop',cfg.running);
      $('power').textContent=cfg.running?'Stop motor':'Start motor';
    }
    $('motor-target').textContent=rpm(target,1)+' rpm';
    if($('lead-0'))$('lead-0').textContent=rpm(target,1)+' RPM';
    if($('lead-1'))$('lead-1').textContent=rpm(target*assembly.config.maxRpm/assembly.config.motor)+' RPM';
    document.querySelectorAll('[data-live-rpm]').forEach(el=>el.textContent=rpm(currentRpm(el.dataset.liveRpm),1));
    document.querySelectorAll('[data-live-note]').forEach(el=>{

  function toggleAudio(){
    if(audible){audible=false;renderComponent();return;}
    const Context=window.AudioContext||window.webkitAudioContext;
    if(!Context)return;
    if(!audio){
      const ctx=new Context();
      const tone=ctx.createOscillator(), gain=ctx.createGain();
      tone.type='sine';gain.gain.value=0;tone.connect(gain).connect(ctx.destination);
      tone.start();audio={ctx,tone,gain};
    }
    audio.ctx.resume();
    audible=true;
    renderComponent();
  }
  function updateAudio(){
    if(!audio)return;
    const track=activeTone();
    const f=track.frequency*speed/assembly.config.motor;
    const response=Math.exp(-TAU * cfg.gap / track.wavelength);
    const t=audio.ctx.currentTime;
    audio.tone.frequency.setTargetAtTime(Math.max(1,f),t,.035);
    audio.gain.gain.setTargetAtTime(audible&&f>14?.075*response*Math.min(1,speed/assembly.config.motor):0,t,.04);
  }

  function animate(t){
    requestAnimationFrame(animate);
    if(!assembly)return;
    const dt=lastFrame?clamp((t-lastFrame)/1000,0,.1):1/60;
    lastFrame=t;
    const v=cfg.running?target:0;
    const before=speed;
    speed+=(v-speed)*(1-Math.exp(-dt/(cfg.running?.7:.62)));
    if(Math.abs(speed-v)<.025) speed=v;
    const cameraMoving=Math.abs(orbit.distance-desired.distance)>.3 || Math.abs(orbit.yaw-desired.yaw)>.001 ||
      Math.abs(orbit.pitch-desired.pitch)>.001 || norm(delta(orbit.target,desired.target))>.13;
    const viewMoving=Math.abs(explode-cfg.explode)>.001;
    if(viewMoving)explode+=(cfg.explode-explode)*Math.min(1, dt*8);else explode=cfg.explode;
    if(cameraMoving)transitionCamera(dt);
    if(speed>.001||before!==speed||dirty||cameraMoving||viewMoving){
      phase+=TAU*speed/60*dt*cfg.rate;
      shaftMap.forEach((s,id)=> motorPhases[id]=phase*s.rpm/assembly.config.motor);
      belts.update(motorPhases,explode);
      if(webglOK){
        const camera=currentCamera();
        showParts();
        renderer.render(visibleParts,camera,{selectedId:cfg.selected,groundY:assembly.bounds.min[1]-1,groundZ:-25});
        plotOverlay();
      }
      dirty=false;
    }
    if(t-lastInfo>100){
      lastInfo=t;
      updateReadouts();
      updateAudio();
    }
  }

  const pointers=new Map();
  let hadDrag=false, lastPointer;
  function direction(evt){
    const scalar=desired.distance/Math.max(300,canvas.clientHeight);
    if(evt.shiftKey || evt.buttons===2) {
      const a=desired.yaw;
      desired.target[0]-=evt.dx*Math.cos(a)*scalar;
      desired.target[2]+=evt.dx*Math.sin(a)*scalar;
      desired.target[1]+=evt.dy*scalar;
    }else{
      desired.yaw-=evt.dx*.008;
      desired.pitch=clamp(desired.pitch+evt.dy*.008,-1.45,1.568);
    }
    cfg.view='free';changeViewButtons();dirty=true;
  }
  canvas.addEventListener('pointerdown',e=>{
    if(!webglOK)return;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){hadDrag=false;lastPointer=[e.clientX,e.clientY];}
    else hadDrag=true;
  });
  canvas.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    const previous=pointers.get(e.pointerId);
    const p={x:e.clientX,y:e.clientY};
    if(pointers.size===2){
      const peer=[...pointers].find(([id])=>id!==e.pointerId)[1];
      const old=Math.hypot(previous.x-peer.x,previous.y-peer.y);
      const next=Math.hypot(p.x-peer.x,p.y-peer.y);
      desired.distance=clamp(desired.distance*old/Math.max(1,next),75,5200);
      dirty=true;
    }else if(pointers.size===1){
      if(Math.hypot(e.clientX-lastPointer[0],e.clientY-lastPointer[1])>4)hadDrag=true;
      if(hadDrag){
        canvas.classList.add('orbiting');
        direction({dx:p.x-previous.x,dy:p.y-previous.y,shiftKey:e.shiftKey,buttons:e.buttons});
      }
    }
    pointers.set(e.pointerId,p);
  });
  function endPointer(e){
    if(!pointers.has(e.pointerId))return;
    const single=pointers.size===1;
    pointers.delete(e.pointerId);
    canvas.classList.remove('orbiting');
    if(single&&!hadDrag&&e.type==='pointerup'&&e.button===0){
      const rect=canvas.getBoundingClientRect();
      pickComponent(renderer.pick(e.clientX-rect.left,e.clientY-rect.top));
    }
  }
  canvas.addEventListener('pointerup',endPointer);
  canvas.addEventListener('pointercancel',endPointer);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('wheel',e=>{
    if(!webglOK)return;
    e.preventDefault();
    desired.distance=clamp(desired.distance*Math.exp(clamp(e.deltaY,-120,120)*.003),75,5200);
    dirty=true;
  },{passive:false});
  canvas.addEventListener('keydown',e=>{
    if(!webglOK)return;
    if(e.key.toLowerCase()==='r'){setView('iso');return;}
    if(e.key===' '){e.preventDefault();setPower();return;}
    const step={ArrowLeft:[-16,0],ArrowRight:[16,0],ArrowUp:[0,-16],ArrowDown:[0,16]}[e.key];
    if(step){e.preventDefault();direction({dx:step[0],dy:step[1],shiftKey:e.shiftKey});}
  });

  $('layout').onchange=e=>setLayout(e.target.value);

  $('motor-rpm').oninput=e=>{target=+e.target.value;updateReadouts(true);};
  $('tune').onclick=()=>{target=assembly.config.motor;$('motor-rpm').value=target;updateReadouts(true);};

  $('component').onchange=e=>{pickComponent(e.target.value);if(cfg.measurement)e.target.value=cfg.selected;};
  $('reset-view').onclick=()=>{cfg.isolate=false;setView(cfg.view==='free'?'iso':cfg.view);renderInspector();refreshControls();};
  modes.forEach(id=>$(id).onclick=()=>setPresentation(id));
  $('camera-views').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  $('inspector-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cfg.tab=b.dataset.inspect;renderInspector();updateReadouts(true);});
  $('data-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{cfg.table=b.dataset.data;renderData();updateReadouts(true);});
  $('layers').querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{cfg.layers[b.dataset.layer]=!cfg.layers[b.dataset.layer];refreshControls();dirty=true;});
  $('labels').onclick=()=>{cfg.labels=!cfg.labels;refreshControls();dirty=true;};
  $('dimensions').onclick=()=>{cfg.showDims=!cfg.showDims;refreshControls();dirty=true;};
  $('measure').onclick=()=>{cfg.measurement=!cfg.measurement;cfg.points=[];refreshControls();dirty=true;};
  $('explode-amount').oninput=e=>{
    cfg.explode=+e.target.value/100;
    cfg.presentation=cfg.explode?'exploded':'assembled';

  try {
    renderer=new TWGRenderer(canvas);
    $('stage-message').hidden=true;
  }catch(error){
    webglOK=false;
    $('stage-message').textContent='WebGL is unavailable in this browser. Open the file in a browser with WebGL enabled.';
    console.error(error);
  }
  canvas.addEventListener('webglcontextlost',e=>{
    e.preventDefault();webglOK=false;$('stage-message').hidden=false;$('stage-message').textContent='Graphics paused. Waiting for WebGL to reconnect…';
  });
  canvas.addEventListener('webglcontextrestored',()=>{
    renderer=new TWGRenderer(canvas);webglOK=true;$('stage-message').hidden=true;dirty=true;
  });
  setLayout('D');
  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
